<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 210" width="100%" height="100%">
  <!-- Fondo suave -->
  <rect width="100%" height="100%" rx="35" fill="#faf8fc" />
  
  <!-- Mente & Florecimiento -->
  <g transform="translate(105, 105)">
    <!-- Órbita punteada -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#5dc1b9" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    
    <!-- Pétalo superior (Ciruela) -->
    <path d="M 0 0 C -25 -15, -35 -40, 0 -50 C 35 -40, 25 -15, 0 0 Z" fill="#553c5e" opacity="0.9"/>
    
    <!-- Pétalo derecho (Turquesa) -->
    <path d="M 0 0 C 15 -25, 40 -35, 50 0 C 40 35, 15 25, 0 0 Z" fill="#5dc1b9" opacity="0.85"/>
    
    <!-- Pétalo izquierdo (Ciruela) -->
    <path d="M 0 0 C -15 25, -40 35, -50 0 C -40 -35, -15 -25, 0 0 Z" fill="#553c5e" opacity="0.75"/>
    
    <!-- Pétalo inferior (Turquesa) -->
    <path d="M 0 0 C 25 15, 35 40, 0 50 C -35 40, -25 15, 0 0 Z" fill="#5dc1b9" opacity="0.9"/>
    
    <!-- Núcleo central -->
    <circle cx="0" cy="0" r="10" fill="#f1eaf5"/>
  </g>
</svg>
